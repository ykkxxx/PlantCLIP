# ============================================================
# Baseline C：CLIP Zero-shot（OpenCLIP ViT-B/32）
# 目的：验证原始 CLIP 直接迁移能力（文档第 4.1 节）
# 说明：冻结全部参数，仅做推理，不训练。
#       文本侧使用 prompt.template 生成类别描述，取最高相似度。
# ============================================================

experiment:
  name: "clip_zeroshot"

model:
  type: "clip"             # 使用 CLIP 预处理
  clip_backbone: "ViT-B-32"  # 注意：open_clip 用连字符，不是 ViT-B/32
  pretrained: "openai"     # open_clip 预训练权重来源
  zero_shot: true          # 冻结权重，仅推理
  num_classes: 38

data:
  root: "/root/PlantCLIP/dataset/data"

# Zero-shot 不训练；此处仅保留批次/种子，供 test.py 使用
training:
  epochs: 0
  batch_size: 64
  seed: 42

# 文本 Prompt 模板（文档第 9 节）。
# 命名占位符 {plant} / {disease} 由 utils/prompts.py 从类别目录名解析而来，
# 例如 "Corn_(maize)___Northern_Leaf_Blight" -> plant="corn", disease="northern leaf blight"。
# 也兼容文档里的单占位符写法（"a photo of a diseased {} leaf"）。
#
# 注意：healthy 类必须走 healthy_templates。若统一用 "diseased {}"，
# 健康类会被描述成患病，语义反了，zero-shot 会大面积误判。
prompt:
  disease_templates:
    - "a photo of a {plant} leaf with {disease}"
    - "a close-up photo of {disease} on a {plant} leaf"
    - "a {plant} leaf infected with {disease}"
  healthy_templates:
    - "a photo of a healthy {plant} leaf"
    - "a close-up photo of a healthy {plant} leaf"
