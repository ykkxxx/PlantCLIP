# ============================================================
# Baseline B：Vision Transformer ViT-B/16（ImageNet 预训练）
# 目的：Transformer 视觉模型基线（文档第 4.1 节）
# 说明：使用 torchvision 内置 vit_b_16 权重，做全量微调。
# ============================================================

experiment:
  name: "vit_b16"

model:
  type: "cnn"              # cnn / clip
  name: "vit_b_16"         # torchvision.models.vit_b_16
  pretrained: true
  num_classes: 38

data:
  root: "/root/PlantCLIP/dataset/data"

training:
  epochs: 50
  batch_size: 64
  optimizer: "adamw"
  lr: 0.00001                # 主干 lr：ViT 全量微调，比 ResNet50 小两个数量级
  weight_decay: 0.05         # AdamW 的标准权重衰减
  head_lr_mult: 10           # 分类头随机初始化，用 10 倍 lr（1e-4）单独成组
  warmup_epochs: 5           # 前 5 轮线性预热，避免初期大梯度破坏预训练特征
  lr_scheduler: "cosine"
  early_stopping_patience: 15  # 预热+小 lr 收敛较慢，放宽早停
  seed: 42
