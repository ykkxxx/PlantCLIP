# ============================================================
# Baseline D：CLIP Fine-tuning（OpenCLIP ViT-B/32）
# 目的：验证领域数据微调后的效果（文档第 4.1 节）
# 说明：微调图像分支；文本分支默认冻结（可通过
#       finetune_text_encoder 开启）。文本侧用 prompt.template。
# ============================================================

experiment:
  name: "clip_finetune"

model:
  type: "clip"             # 使用 CLIP 预处理
  clip_backbone: "ViT-B/32"
  pretrained: "openai"
  zero_shot: false         # 需要微调训练
  finetune_text_encoder: false   # true 表示同时微调文本编码器
  num_classes: 38

data:
  root: "~/autodl-tmp/PlantVillage-Dataset-master/raw/color"

training:
  epochs: 50
  batch_size: 64
  optimizer: "adam"
  lr: 1e-5                 # 微调预训练大模型用小学习率
  weight_decay: 1e-4
  lr_scheduler: "cosine"
  early_stopping_patience: 10
  seed: 42

# 文本 Prompt 模板
prompt:
  template: "a photo of a diseased {} leaf"
